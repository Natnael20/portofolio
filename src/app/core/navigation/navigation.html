<!-- INTRO POPOVER-->
<div class="lang-intro" [class.show]="showLangIntro">
  <div class="lang-intro-box">
    <button class="lang-intro-close" (click)="dismissIntro()" aria-label="Close">✕</button>

    <div class="lang-intro-icon">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff"
        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10" />
        <line x1="2" y1="12" x2="22" y2="12" />
        <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z" />
      </svg>
    </div>

    <h6 class="lang-intro-title">Read in your language</h6>
    <p class="lang-intro-text">
      Click the globe to switch between <strong>English</strong> and <strong>Swedish</strong>.
    </p>

    <div class="lang-intro-steps">
      <div class="step">
        <span class="step-dot"></span>
        <span>Click the globe icon</span>
      </div>
      <div class="step">
        <span class="step-dot"></span>
        <span>Page translates instantly</span>
      </div>
      <div class="step">
        <span class="step-dot"></span>
        <span>Your choice is remembered</span>
      </div>
    </div>

    <button class="btn-custom w-100 p-2 small lead fw-light" (click)="dismissIntro()">Got it</button>
  </div>
</div>
